<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>往診ルート・滞在トラッカー (モックアップ)</title>
    <!-- 地図用ライブラリ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #10b981;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0,0,0,0.03);
        }

        .logo {
            padding: 24px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-dark);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .staff-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .staff-card {
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .staff-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.1);
        }

        .staff-card.active {
            background-color: #f0f9ff;
            border-color: var(--primary);
        }

        .staff-name {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .staff-status {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.active { background-color: var(--secondary); }
        .status-dot.moving { background-color: var(--primary); }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 70px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 32px;
            justify-content: space-between;
        }

        .dashboard-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            padding: 24px;
            overflow: hidden;
        }

        /* Map Area */
        .map-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            width: 100%;
        }

        /* Timeline Area */
        .timeline-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            padding: 24px;
            overflow-y: auto;
        }

        .timeline-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .timeline-item {
            position: relative;
            padding-left: 32px;
            margin-bottom: 28px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 6px;
            bottom: -34px;
            width: 2px;
            background-color: var(--border);
        }

        .timeline-item:last-child::before {
            display: none;
        }

        .timeline-marker {
            position: absolute;
            left: 0;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: white;
            border: 3px solid var(--primary);
            z-index: 1;
        }

        .timeline-item.active .timeline-marker {
            border-color: var(--secondary);
            animation: pulse 2s infinite;
        }

        .stay-time {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stay-location {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .stay-duration {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: #f8fafc;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .report-textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.95rem;
            resize: vertical;
            margin-bottom: 16px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            📍 往診トラッカー
        </div>
        <div class="staff-list" id="staff-list">
            <!-- JSで動的に生成 -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <h2 style="font-size: 1.2rem; font-weight: 600;">行動履歴ダッシュボード</h2>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button id="btn-open-manage" class="btn-primary" style="background-color: #8b5cf6;">🏢 施設管理</button>
                <button id="btn-open-search" class="btn-primary" style="background-color: var(--secondary);">🔍 履歴検索</button>
                <button id="btn-generate-report" class="btn-primary">📝 日報自動生成</button>
                <div style="font-size: 0.9rem; color: var(--text-muted);">
                    最終更新: <span id="current-time"></span>
                </div>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="map-card">
                <div style="padding: 16px 24px; border-bottom: 1px solid var(--border); font-weight: 600;">
                    現在地と移動ルート
                </div>
                <!-- ここにマップが表示されます -->
                <div id="map"></div>
            </div>

            <div class="timeline-card">
                <div class="timeline-title" id="timeline-title">本日の訪問タイムライン</div>
                <div id="timeline-container">
                    <!-- JSで動的に生成 -->
                </div>
            </div>
        </div>
    </main>

    <!-- Report Modal -->
    <div class="modal-overlay" id="report-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">自動生成された日報</div>
                <button class="btn-close" id="btn-close-modal">&times;</button>
            </div>
            <textarea class="report-textarea" id="report-text"></textarea>
            <div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between;">
                <div style="font-size: 0.9rem; color: var(--text-muted); text-align: left;">
                    <label>送信先: </label>
                    <input type="email" id="target-email" value="example@gmail.com" style="padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; width: 220px;" placeholder="指定のGmailアドレス">
                </div>
                <button class="btn-primary" id="btn-submit-report">🚀 バックグラウンドで自動送信</button>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div class="modal-overlay" id="search-modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <div class="modal-title">過去の訪問履歴検索</div>
                <button class="btn-close" id="btn-close-search-modal">&times;</button>
            </div>
            <div style="display: flex; gap: 16px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">スタッフ名</label>
                    <select id="search-staff" style="padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                        <option value="">すべて</option>
                        <option value="山田 太郎 医師">山田 太郎 医師</option>
                        <option value="伊藤 花子 看護師">伊藤 花子 看護師</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">日付</label>
                    <input type="date" id="search-date" style="padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                </div>
                <div>
                    <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">患者名 (訪問先)</label>
                    <input type="text" id="search-patient" placeholder="例: 佐藤" style="padding: 8px; border-radius: 4px; border: 1px solid var(--border); width: 140px;">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="btn-primary" id="btn-execute-search">検索する</button>
                </div>
            </div>
            
            <div style="max-height: 400px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="background: var(--bg-body); position: sticky; top: 0;">
                        <tr>
                            <th style="padding: 12px; border-bottom: 1px solid var(--border);">日付</th>
                            <th style="padding: 12px; border-bottom: 1px solid var(--border);">時間</th>
                            <th style="padding: 12px; border-bottom: 1px solid var(--border);">区分</th>
                            <th style="padding: 12px; border-bottom: 1px solid var(--border);">スタッフ</th>
                            <th style="padding: 12px; border-bottom: 1px solid var(--border);">訪問先</th>
                            <th style="padding: 12px; border-bottom: 1px solid var(--border);">滞在時間</th>
                        </tr>
                    </thead>
                    <tbody id="search-results-body">
                        <tr><td colspan="6" style="padding: 16px; text-align: center; color: var(--text-muted);">検索条件を指定して「検索する」を押してください</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Manage Modal -->
    <div class="modal-overlay" id="manage-modal">
        <div class="modal-content" style="max-width: 600px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <div class="modal-title">施設・患者の管理</div>
                <button class="btn-close" id="btn-close-manage-modal">&times;</button>
            </div>
            
            <div style="margin-bottom: 24px;">
                <h3 style="font-size: 1.05rem; margin-bottom: 12px; border-bottom: 2px solid var(--primary); display: inline-block;">新規施設の登録</h3>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div>
                        <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">施設ID (半角英数)</label>
                        <input type="text" id="new-facility-id" placeholder="例: f3" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">施設名</label>
                        <input type="text" id="new-facility-name" placeholder="例: 青空クリニック" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">所在地（住所）から座標を検索</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="new-facility-address" placeholder="例: 東京都千代田区1-1-1" style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                            <button type="button" class="btn-primary" id="btn-geocode" style="background-color: var(--secondary); white-space: nowrap;">🔍 座標を取得</button>
                        </div>
                    </div>
                    <div style="display: flex; gap: 12px;">
                        <div style="flex: 1;">
                            <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">緯度 (Lat)</label>
                            <input type="number" step="0.000001" id="new-facility-lat" placeholder="例: 35.681236" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                        </div>
                        <div style="flex: 1;">
                            <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">経度 (Lng)</label>
                            <input type="number" step="0.000001" id="new-facility-lng" placeholder="例: 139.767125" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                        </div>
                    </div>
                    <button class="btn-primary" id="btn-submit-facility" style="align-self: flex-start;">施設を登録</button>
                </div>
            </div>

            <div>
                <h3 style="font-size: 1.05rem; margin-bottom: 12px; border-bottom: 2px solid var(--secondary); display: inline-block;">患者の追加</h3>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div>
                        <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">対象施設</label>
                        <select id="select-facility" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                            <option value="">施設を読み込み中...</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">患者ID (半角英数)</label>
                        <input type="text" id="new-patient-id" placeholder="例: p4" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">患者名</label>
                        <input type="text" id="new-patient-name" placeholder="例: 渡辺 健太 様" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.9rem; margin-bottom: 4px;">部屋・特記事項</label>
                        <input type="text" id="new-patient-room" placeholder="例: 201号室 / マッサージ" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border);">
                    </div>
                    <button class="btn-primary" id="btn-submit-patient" style="align-self: flex-start; background-color: var(--secondary);">患者を追加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // ダミーデータ（本来はデータベースから取得する内容）
        const staffData = [
            {
                id: 1,
                name: '山田 太郎 医師',
                status: '滞在中',
                isMoving: false,
                route: [
                    [35.6812, 139.7671], // 東京駅周辺
                    [35.6852, 139.7531], // 皇居周辺
                    [35.6902, 139.7501], // 九段下周辺（現在地）
                ],
                timeline: [
                    { time: '09:00 - 10:15', location: '佐藤様 宅 (中央区)', duration: '1時間15分', category: 'マッサージ', active: false },
                    { time: '10:30 - 11:00', location: '鈴木様 宅 (千代田区)', duration: '30分', category: '鍼灸', active: false },
                    { time: '11:15 - 現在', location: '高橋様 宅 (九段下)', duration: '滞在中 (45分経過)', category: 'ダブル', active: true }
                ]
            },
            {
                id: 2,
                name: '伊藤 花子 看護師',
                status: '移動中',
                isMoving: true,
                route: [
                    [35.6580, 139.7016], // 渋谷
                    [35.6620, 139.7036], // 原宿方面
                    [35.6680, 139.7086], // 表参道周辺への移動中（現在地）
                ],
                timeline: [
                    { time: '09:30 - 10:45', location: '渡辺様 宅 (渋谷区)', duration: '1時間15分', category: 'マッサージ', active: false },
                    { time: '11:00 - 11:50', location: '小林様 宅 (神宮前)', duration: '50分', category: '鍼灸', active: false },
                    { time: '11:50 - 現在', location: '移動中 (次の訪問先へ)', duration: '15分経過', category: '未設定', active: true }
                ]
            }
        ];

        // マップの初期化
        const map = L.map('map').setView([35.6812, 139.7671], 13);
        
        // モダンでクリーンな地図タイル（CartoDB Voyager）を使用
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        let currentPolyline = null;
        let currentMarkers = [];
        let currentStaff = null;

        // 時計の更新
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString('ja-JP');
        }, 1000);

        // スタッフリストの生成
        const renderStaffList = () => {
            const container = document.getElementById('staff-list');
            container.innerHTML = '';

            staffData.forEach((staff, index) => {
                const card = document.createElement('div');
                card.className = `staff-card ${index === 0 ? 'active' : ''}`;
                const statusClass = staff.isMoving ? 'moving' : 'active';
                
                card.innerHTML = `
                    <div class="staff-name">${staff.name}</div>
                    <div class="staff-status">
                        <div class="status-dot ${statusClass}"></div>
                        ${staff.status}
                    </div>
                `;

                card.onclick = () => {
                    document.querySelectorAll('.staff-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    selectStaff(staff);
                };

                container.appendChild(card);
            });
        };

        // スタッフ選択時の処理（マップとタイムラインの更新）
        const selectStaff = (staff) => {
            currentStaff = staff;
            // タイトル更新
            document.getElementById('timeline-title').innerText = `${staff.name} の本日のルート`;

            // 既存の線とマーカーを消去
            if (currentPolyline) map.removeLayer(currentPolyline);
            currentMarkers.forEach(m => map.removeLayer(m));
            currentMarkers = [];

            // マップに赤い線（ルート）を描画
            currentPolyline = L.polyline(staff.route, {color: '#0ea5e9', weight: 4, opacity: 0.7}).addTo(map);

            // 訪問先にマーカーを配置
            staff.route.forEach((coords, i) => {
                const isCurrent = i === staff.route.length - 1;
                
                // カスタムアイコン（現在地は色を変えるなど）
                const markerHtml = `
                    <div style="background-color: ${isCurrent ? '#10b981' : '#fff'}; 
                                border: 3px solid ${isCurrent ? '#fff' : '#0ea5e9'}; 
                                width: 20px; height: 20px; border-radius: 50%; 
                                box-shadow: 0 2px 5px rgba(0,0,0,0.3);">
                    </div>
                `;
                const customIcon = L.divIcon({
                    html: markerHtml,
                    className: '',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });

                const marker = L.marker(coords, {icon: customIcon}).addTo(map);
                
                if(isCurrent) {
                    marker.bindPopup(`<b>${staff.name}</b><br>現在地`).openPopup();
                } else {
                    marker.bindPopup(`訪問先 ${i + 1}`);
                }
                
                currentMarkers.push(marker);
            });

            // マップの視点をルートに合わせてズーム
            map.fitBounds(currentPolyline.getBounds(), { padding: [50, 50] });

            // タイムラインの生成
            const timelineContainer = document.getElementById('timeline-container');
            timelineContainer.innerHTML = '';

            staff.timeline.forEach(item => {
                const div = document.createElement('div');
                div.className = `timeline-item ${item.active ? 'active' : ''}`;
                
                div.innerHTML = `
                    <div class="timeline-marker"></div>
                    <div class="stay-time">${item.time}</div>
                    <div class="stay-location">${item.location} <span style="font-size: 0.8rem; background: var(--bg-body); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-muted); margin-left: 8px;">${item.category || '未設定'}</span></div>
                    <div class="stay-duration">
                        ${item.active ? '🔄 ' : '✅ '}${item.duration}
                    </div>
                `;
                timelineContainer.appendChild(div);
            });
        };

        // 日報生成ロジック
        document.getElementById('btn-generate-report').addEventListener('click', () => {
            if (!currentStaff) return;
            
            const now = new Date();
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 (${days[now.getDay()]})`;
            
            let reportContent = `【業務日報】\n`;
            reportContent += `提出日: ${dateStr}\n`;
            reportContent += `氏名: ${currentStaff.name}\n`;
            reportContent += `----------------------------------------\n`;
            reportContent += `【本日の訪問履歴】\n`;

            currentStaff.timeline.forEach((item, index) => {
                reportContent += ` ${index + 1}. ${item.time}\n`;
                const categoryStr = item.category ? `【${item.category}】 ` : '';
                reportContent += `    訪問先: ${categoryStr}${item.location}\n`;
                reportContent += `    滞在時間: ${item.duration}\n`;
                reportContent += `    特記事項: なし\n\n`;
            });

            reportContent += `----------------------------------------\n`;
            reportContent += `【全体所感】\n\n（ここに所感・申し送り事項を入力します）\n`;

            document.getElementById('report-text').value = reportContent;
            document.getElementById('report-modal').style.display = 'flex';
        });

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            document.getElementById('report-modal').style.display = 'none';
        });

        // サーバー連携によるバックグラウンド自動送信ロジック（fetch APIを使用）
        document.getElementById('btn-submit-report').addEventListener('click', async () => {
            const reportText = document.getElementById('report-text').value;
            const targetEmail = document.getElementById('target-email').value;
            
            if (!targetEmail) {
                alert('送信先のメールアドレスを入力してください。');
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const subject = `【業務日報】${currentStaff.name} - ${new Date().toLocaleDateString('ja-JP')}`;
            
            // ボタンのローディング表示
            const btn = document.getElementById('btn-submit-report');
            const originalText = btn.innerText;
            btn.innerText = "送信中...";
            btn.disabled = true;

            try {
                // Node.jsのローカルサーバー(ポート3000)へ日報データと保存用の構造化データを送信
                const response = await fetch('/api/send-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        toEmail: targetEmail,
                        subject: subject,
                        text: reportText,
                        staffName: currentStaff.name,
                        date: dateStr,
                        visits: currentStaff.timeline
                    })
                });

                const result = await response.json();
                
                if (response.ok) {
                    alert('✨ 日報の自動送信が完了しました！');
                    document.getElementById('report-modal').style.display = 'none';
                } else {
                    alert(`❌ 送信エラー: ${result.message}\n(server.jsのパスワード設定が正しいか確認してください)`);
                }
            } catch (error) {
                alert('⚠️ サーバーに接続できませんでした。\nNode.jsサーバー（server.js）が起動しているか確認してください。');
                console.error('Fetch API Error:', error);
            } finally {
                // ボタンの表示・状態を元に戻す
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // 検索モーダルのロジック
        document.getElementById('btn-open-search').addEventListener('click', () => {
            document.getElementById('search-modal').style.display = 'flex';
        });

        document.getElementById('btn-close-search-modal').addEventListener('click', () => {
            document.getElementById('search-modal').style.display = 'none';
        });

        document.getElementById('btn-execute-search').addEventListener('click', async () => {
            const staffName = document.getElementById('search-staff').value;
            const date = document.getElementById('search-date').value;
            const patientName = document.getElementById('search-patient').value;
            const tbody = document.getElementById('search-results-body');
            
            tbody.innerHTML = '<tr><td colspan="6" style="padding: 16px; text-align: center; color: var(--text-muted);">検索中...</td></tr>';
            
            let url = '/api/visits?';
            if (staffName) url += `staffName=${encodeURIComponent(staffName)}&`;
            if (date) url += `date=${encodeURIComponent(date)}&`;
            if (patientName) url += `patientName=${encodeURIComponent(patientName)}&`;

            try {
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    result.data.forEach(row => {
                        const d = new Date(row.visit_date);
                        const dayStr = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
                        
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="padding: 12px; border-bottom: 1px solid var(--border);">${row.visit_date} (${dayStr})</td>
                            <td style="padding: 12px; border-bottom: 1px solid var(--border);">${row.time_range}</td>
                            <td style="padding: 12px; border-bottom: 1px solid var(--border);"><span style="font-size: 0.85rem; background: #e0f2fe; color: #0284c7; padding: 4px 8px; border-radius: 4px; font-weight: 500; display: inline-block;">${row.category || '未設定'}</span></td>
                            <td style="padding: 12px; border-bottom: 1px solid var(--border); font-weight: 500;">${row.staff_name}</td>
                            <td style="padding: 12px; border-bottom: 1px solid var(--border);">${row.location}</td>
                            <td style="padding: 12px; border-bottom: 1px solid var(--border);">${row.duration}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="padding: 16px; text-align: center; color: var(--text-muted);">該当する記録は見つかりませんでした</td></tr>';
                }
            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="6" style="padding: 16px; text-align: center; color: red;">サーバーエラーが発生しました</td></tr>';
            }
        });

        // ==========================================
        // 施設管理モーダルのロジック
        // ==========================================
        const loadFacilitiesForSelect = async () => {
            try {
                const response = await fetch('/api/facilities');
                const result = await response.json();
                if (result.success) {
                    const select = document.getElementById('select-facility');
                    select.innerHTML = '<option value="">施設を選択してください</option>';
                    result.data.forEach(f => {
                        const opt = document.createElement('option');
                        opt.value = f.id;
                        opt.textContent = f.name;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error('施設一覧の取得に失敗しました', err);
            }
        };

        document.getElementById('btn-open-manage').addEventListener('click', () => {
            loadFacilitiesForSelect();
            document.getElementById('manage-modal').style.display = 'flex';
        });

        document.getElementById('btn-close-manage-modal').addEventListener('click', () => {
            document.getElementById('manage-modal').style.display = 'none';
        });

        // 住所から緯度経度を検索 (ジオコーディング)
        document.getElementById('btn-geocode').addEventListener('click', async () => {
            const address = document.getElementById('new-facility-address').value;
            if (!address) {
                alert('住所を入力してください。');
                return;
            }
            
            const btn = document.getElementById('btn-geocode');
            const originalText = btn.innerText;
            btn.innerText = "検索中...";
            btn.disabled = true;

            try {
                // OpenStreetMap (Nominatim) の無料APIを利用
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    document.getElementById('new-facility-lat').value = parseFloat(data[0].lat).toFixed(6);
                    document.getElementById('new-facility-lng').value = parseFloat(data[0].lon).toFixed(6);
                    
                    // 施設名が未入力なら入力された住所で仮埋めしておく
                    const nameInput = document.getElementById('new-facility-name');
                    if (!nameInput.value) {
                        nameInput.value = address;
                    }
                } else {
                    alert('住所から座標を特定できませんでした。住所の表記を少し変えて再度お試しください。（例：建物名を省いて番地までにする等）');
                }
            } catch (err) {
                console.error('ジオコーディングエラー:', err);
                alert('検索中にエラーが発生しました。ネットワーク接続をご確認ください。');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('btn-submit-facility').addEventListener('click', async () => {
            const id = document.getElementById('new-facility-id').value;
            const name = document.getElementById('new-facility-name').value;
            const lat = document.getElementById('new-facility-lat').value;
            const lng = document.getElementById('new-facility-lng').value;
            
            if(!id || !name || !lat || !lng) return alert('入力項目が不足しています。');
            
            try {
                const res = await fetch('/api/facilities', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id, name, lat: parseFloat(lat), lng: parseFloat(lng)})
                });
                const data = await res.json();
                if(data.success) {
                    alert('施設を追加しました');
                    document.getElementById('new-facility-id').value = '';
                    document.getElementById('new-facility-name').value = '';
                    document.getElementById('new-facility-lat').value = '';
                    document.getElementById('new-facility-lng').value = '';
                    loadFacilitiesForSelect(); // セレクトボックス更新
                } else {
                    alert('エラー: ' + data.message);
                }
            } catch(e) {
                alert('通信エラー');
            }
        });

        document.getElementById('btn-submit-patient').addEventListener('click', async () => {
            const facility_id = document.getElementById('select-facility').value;
            const id = document.getElementById('new-patient-id').value;
            const name = document.getElementById('new-patient-name').value;
            const room = document.getElementById('new-patient-room').value;
            
            if(!facility_id || !id || !name || !room) return alert('入力項目が不足しています。');
            
            try {
                const res = await fetch('/api/patients', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id, facility_id, name, room})
                });
                const data = await res.json();
                if(data.success) {
                    alert('患者を追加しました');
                    document.getElementById('new-patient-id').value = '';
                    document.getElementById('new-patient-name').value = '';
                    document.getElementById('new-patient-room').value = '';
                } else {
                    alert('エラー: ' + data.message);
                }
            } catch(e) {
                alert('通信エラー');
            }
        });

        // 初期表示
        renderStaffList();
        selectStaff(staffData[0]);

    </script>
</body>
</html>
